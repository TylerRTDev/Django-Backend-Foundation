# Docker Compose perf profile — opt-in benchmark environment.
#
# Usage:  docker compose -f docker-compose.yaml -f docker-compose.perf.yaml up
#
# Starts a k6 container inside the Docker network for benchmark
# execution against the web service at http://web:8000.
#
# Override the k6 script with:
#   K6_SCRIPT=api_baseline.js docker compose -f docker-compose.yaml -f docker-compose.perf.yaml run --rm k6
#
# Set worker/thread config before running, either in .env or inline:
#   WORKERS=4 THREADS=2 TIMEOUT=60 docker compose -f ... up
#
services:
  k6:
    image: grafana/k6:latest
    container_name: django_test_k6
    entrypoint: ["sh", "-c", "k6 run --out experimental-prometheus-rw /scripts/${K6_SCRIPT:-smoke.js}"]
    volumes:
      - ./scripts/k6:/scripts
      - ./Memcache Unconfigured Cache Resutls:/results
    environment:
      BASE_URL: http://web:8000
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_SCRIPT: smoke.js
    depends_on:
      - web