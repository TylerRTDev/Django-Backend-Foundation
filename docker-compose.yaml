services:
  minio:
    image: minio/minio
    env_file:
      - .env
    container_name: language_app_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Web console
    depends_on:
      - db

  db:
    image: postgres:16
    container_name: language_app_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432" # Change to "5433:5432" if you have a local Postgres instance running on 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: language_app_web
    command: python manage.py runserver 0.0.0.0:8000
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev # Specify the settings module for development ('config.settings.prod' for production)
    volumes:
      - .:/app
    ports:
      - "8001:8000"
    depends_on:
      - db

volumes:
  postgres_data:
  minio_data:
